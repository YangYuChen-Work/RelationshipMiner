  - id: direct-02
    category: direct_alias
    input: 查看需求表
    expected_tables: [requirement, demand_parameter, requirement_folder]
  - id: direct-03
    category: direct_alias
    input: 需求数据关系
    expected_tables: [requirement, demand_parameter, requirement_folder]
  - id: direct-04
    category: direct_alias
    input: 产品需求
    expected_tables: [requirement, demand_parameter, requirement_folder]
  - id: direct-05
    category: direct_alias
    input: 客户需求
    expected_tables: [requirement, demand_parameter, requirement_folder]
  - id: direct-06
    category: direct_alias
