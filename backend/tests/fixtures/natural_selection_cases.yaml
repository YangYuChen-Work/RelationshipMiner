  - id: direct-12
    category: direct_alias
    input: 工序表
    expected_tables: [meprocess, mestep, meoperation]
  - id: direct-13
    category: direct_alias
    input: 加工步骤
    expected_tables: [meprocess, mestep, meoperation]
  - id: direct-14
    category: direct_alias
    input: 工艺步骤
