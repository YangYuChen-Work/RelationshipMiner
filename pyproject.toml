[project]
name = "ai-graph"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=43",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "numpy>=2.0,<3.0",
    "openai>=1.0,<2.0",
    "pydantic==2.11.4",
    "pyyaml==6.0.2",
    "pymysql==1.1.1",
    "python-dotenv==1.1.0",
    "sentence-transformers>=5.6,<6.0",
    "sqlalchemy==2.0.40",
    "usearch==2.26.0",
    "uvicorn[standard]==0.34.2",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "aiosqlite==0.21.0",
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
]

[tool.uv]
package = false
link-mode = "copy"
